services:
  db:
    image: postgres:15-alpine
    container_name: db
    restart: unless-stopped
    shm_size: 512mb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: postgres_db
      POSTGRES_USER: postgres_user
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U example -d MyDB"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 80s


volumes:
  postgres_data:
    name: postgres_data_volume

networks:
  app-network:
    driver: bridge
      

